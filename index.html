<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinesh Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- This is the header -->
  <header>
    <h1>Dinesh Gallery</h1>
    <p>My simple image gallery made with CSS Grid (<span id="count"></span> items)</p>
  </header>

  <!-- The gallery: 6 items with a picture and a caption -->
  <div class="gallery">

    <div class="item">
      <div class="pic pic1">🌄</div>
      <p class="caption">Mountains</p>
    </div>

    <div class="item">
      <div class="pic pic2">🌊</div>
      <p class="caption">Sea</p>
    </div>

    <div class="item">
      <div class="pic pic3">🌳</div>
      <p class="caption">Forest</p>
    </div>

    <div class="item">
      <div class="pic pic4">🌇</div>
      <p class="caption">Sunset</p>
    </div>

    <div class="item">
      <div class="pic pic5">🏔️</div>
      <p class="caption">Snow</p>
    </div>

    <div class="item">
      <div class="pic pic6">🌵</div>
      <p class="caption">Desert</p>
    </div>

  </div>

  <!-- This is the footer -->
  <footer>
    <p>Copyright 2026 | Dinesh Gallery | Made by Dinesh Prasad</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
