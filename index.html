<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinesh Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- This is the header -->
  <header>
    <h1>Dinesh Gallery</h1>
    <p>My nature gallery made with CSS Grid (<span id="count"></span> photos)</p>
  </header>

  <!-- The gallery: 6 nature photos from Unsplash with captions -->
  <div class="gallery">

    <div class="item">
      <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=600&q=60" alt="Mountain">
      <p class="caption">Mountain</p>
    </div>

    <div class="item">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=60" alt="Forest">
      <p class="caption">Forest</p>
    </div>

    <div class="item">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=60" alt="Beach">
      <p class="caption">Beach</p>
    </div>

    <div class="item">
      <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=60" alt="Foggy Hills">
      <p class="caption">Foggy Hills</p>
    </div>

    <div class="item">
      <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=600&q=60" alt="Waterfall">
      <p class="caption">Waterfall</p>
    </div>

    <div class="item">
      <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=600&q=60" alt="Flowers">
      <p class="caption">Flowers</p>
    </div>

  </div>

  <!-- This is the footer -->
  <footer>
    <p>Copyright 2026 | Dinesh Gallery | Made by Dinesh Prasad</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
